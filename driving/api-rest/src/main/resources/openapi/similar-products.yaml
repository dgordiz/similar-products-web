openapi: 3.0.0
info:
  title: SimilarProducts API
  version: '1.0'
servers:
  - url: 'http://localhost:5000'
paths:
  '/product/{productId}/similar':
    parameters:
      - schema:
          type: string
        name: productId
        in: path
        required: true
    get:
      operationId: getProductSimilar
      summary: Similar products
      description: Returns the items similar to a given product ordered by similarity.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimilarProducts'
        '404':
          description: Product not found
        '503':
          description: Service unavailable due to global concurrency protection
components:
  schemas:
    SimilarProducts:
      type: array
      description: List of similar products to a given one ordered by similarity.
      minItems: 0
      uniqueItems: true
      items:
        $ref: '#/components/schemas/ProductDetail'
    ProductDetail:
      description: Product detail
      type: object
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        price:
          type: number
          format: double
        availability:
          type: boolean
      required:
        - id
        - name
        - price
        - availability
